name: iOS build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the iOS IPA to, e.g. v1.3.0'
        required: true
        default: 'v1.3.0'
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  ios:
    name: Build and attach iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry HabitTrackerM3E-v1.3.0.ipa Payload
          cp HabitTrackerM3E-v1.3.0.ipa Streak-ios.ipa

      - name: Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            HabitTrackerM3E-v1.3.0.ipa
            Streak-ios.ipa
