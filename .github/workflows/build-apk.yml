name: Build & Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag / version, e.g. v1.1.0'
        required: true
        type: string

permissions:
  contents: write

# Pinned Flutter version so release builds stay reproducible.
# its build matches upstream. Defined once here and reused by both jobs.
env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build:
    name: Build split APKs
    runs-on: ubuntu-latest
    # Only as a pull request check. A tagged run goes straight to release, which
    # builds and signs on its own, so nothing is compiled twice.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # ABI splits keep each APK small (~15-20 MB) instead of one ~58 MB fat APK.
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     HabitTrackerM3E-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   HabitTrackerM3E-armeabi-v7a.apk
          mv app-x86_64-release.apk        HabitTrackerM3E-x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/app/outputs/flutter-apk/HabitTrackerM3E-*.apk
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    # Only when manually dispatched with a tag. The notes are generated from the
    # merged pull requests, and the rest is filled in by hand after publishing.
    if: github.event_name == 'workflow_dispatch'

    # Reproducible build: keep the pub cache at a fixed path inside the workspace
    # (relocated to the runner's working directory).
    # this exact same path and uses the same PUB_CACHE, so the embedded paths match.
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Reproducibility: the jni package bakes a unique build-id into libdartjni.so.
      # Force --build-id=none so the native lib is deterministic. The build also applies
      # this exact same patch in its recipe.
      - name: Patch jni build-id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt

      # Sign the release APKs with the release keystore (kept in GitHub Secrets)
      # so the published binaries stay byte-for-byte reproducible.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/habit-trackerm3e-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=habit-trackerm3e-release.jks
          EOF

      # Reproducible build: version name AND code come entirely from pubspec.yaml
      # (1.1.0+2). Do NOT pass --build-name or
      # --build-number here, or the version will drift between builds.
      # --split-debug-info moves the path-laden debug symbols out of libapp.so so it
      # builds deterministically.
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     HabitTrackerM3E-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   HabitTrackerM3E-armeabi-v7a.apk
          mv app-x86_64-release.apk        HabitTrackerM3E-x86_64.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/HabitTrackerM3E-arm64-v8a.apk
            build/app/outputs/flutter-apk/HabitTrackerM3E-armeabi-v7a.apk
            build/app/outputs/flutter-apk/HabitTrackerM3E-x86_64.apk

  windows:
    name: Build Windows
    runs-on: windows-latest
    # Runs after the release exists and only adds the zip to it. Kept separate on
    # purpose: if the Windows build ever breaks, the APKs are already published.
    needs: release
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # Everything the app needs to run: Streak.exe, the plugin DLLs, the MSVC
      # runtime and data/. Unzip anywhere and double click.
      - name: Zip the build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath HabitTrackerM3E-windows-x64.zip

      - name: Add it to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: HabitTrackerM3E-windows-x64.zip

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    needs: release
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Install build dependencies
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl git jq unzip xz-utils zip file ca-certificates desktop-file-utils clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev lld

      - name: Let git trust the container directories
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package
        run: bash linux/package.sh

      - name: Add them to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            HabitTrackerM3E-linux-x64.tar.gz
            HabitTrackerM3E-x86_64.AppImage
